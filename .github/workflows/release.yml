name: Release

on:
  push:
    branches:
      - main
      - beta

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: frstycodes/typesafe-query-keys
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Setup git user
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Determine release channel
        id: release-channel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=beta" >> $GITHUB_OUTPUT
          else
            echo "channel=latest" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Check if version was published
        id: check-version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NPM_TAG="${{ steps.release-channel.outputs.npm_tag }}"

          echo "Current version: $CURRENT_VERSION"
          echo "Checking npm registry for version on tag: $NPM_TAG"

          # Check if this version exists on npm with the current tag
          PUBLISHED_VERSION=$(npm view @frsty/typesafe-query-keys@$NPM_TAG version 2>/dev/null || echo "none")

          echo "Published version on $NPM_TAG tag: $PUBLISHED_VERSION"

          if [ "$PUBLISHED_VERSION" = "$CURRENT_VERSION" ]; then
            echo "Version $CURRENT_VERSION already published to $NPM_TAG tag"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT_VERSION not yet published to $NPM_TAG tag"
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.check-version.outputs.should_publish == 'true'
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          prerelease: ${{ steps.release-channel.outputs.is_prerelease }}
          tag: v${{ steps.check-version.outputs.version }}
          name: v${{ steps.check-version.outputs.version }}
          body: |
            Please refer to [CHANGELOG.md](./CHANGELOG.md) for details.

      - name: Publish to npm
        if: steps.check-version.outputs.should_publish == 'true'
        run: pnpm publish --no-git-checks --tag ${{ steps.release-channel.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
